<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;600;700&family=Chakra+Petch:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>Aegis AI</title>
    <style>
        /* ============================================
           AEGIS AI — Themeable UI
           ============================================ */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Color tokens — overridden by theme */
            --lcars-bg: #000000;
            --lcars-surface: #0a0a0a;
            --lcars-text: #D1D5DB;
            --lcars-text-dim: #9CA3AF;

            --lcars-blue-1: #3B82F6;
            --lcars-blue-2: #1D4ED8;
            --lcars-blue-3: #93C5FD;

            --lcars-purple-1: #8B5CF6;
            --lcars-purple-2: #6D28D9;
            --lcars-purple-3: #C4B5FD;

            --lcars-pink-1: #EC4899;
            --lcars-pink-2: #BE185D;
            --lcars-pink-3: #FBCFE8;

            --lcars-grey-1: #374151;
            --lcars-grey-2: #6B7280;
            --lcars-grey-3: #D1D5DB;
            --lcars-grey-4: #9CA3AF;

            --lcars-success: #22c55e;
            --lcars-warning: #f59e0b;
            --lcars-error: #ef4444;

            /* Layout */
            --sidebar-width: 200px;
            --top-bar-height: 48px;
            --bottom-bar-height: 56px;
            --elbow-radius: 40px;
            --bar-gap: 2px;

            /* Fonts */
            --font-display: 'Antonio', 'Orbitron', 'Segoe UI', sans-serif;
            --font-body: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
        }

        body {
            font-family: var(--font-body);
            background: var(--lcars-bg);
            color: var(--lcars-text);
            height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== LCARS FRAME ========== */

        .lcars-frame {
            display: grid;
            grid-template-rows: var(--top-bar-height) 1fr var(--bottom-bar-height);
            grid-template-columns: var(--sidebar-width) 1fr;
            height: 100dvh;
            gap: 0;
        }

        /* ========== TOP BAR ========== */

        .lcars-top-bar {
            grid-column: 1 / -1;
            display: flex;
            align-items: stretch;
            gap: var(--bar-gap);
            padding: 0;
            overflow: hidden;
        }

        .lcars-top-bar .endcap-left {
            width: var(--sidebar-width);
            background: var(--lcars-blue-1);
            border-radius: 0 0 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .lcars-top-bar .endcap-left .hamburger {
            display: none;
            background: none;
            border: none;
            color: #000;
            font-size: 22px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .lcars-top-bar .bar-segment {
            flex: 0 0 auto;
        }

        .lcars-top-bar .bar-seg-1 { width: 80px; background: var(--lcars-blue-2); }
        .lcars-top-bar .bar-seg-2 { width: 40px; background: var(--lcars-purple-1); }
        .lcars-top-bar .bar-seg-3 { flex: 1; background: var(--lcars-purple-2); }

        .lcars-top-bar .title-area {
            flex: 2;
            background: var(--lcars-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 20px;
            border-bottom: 3px solid var(--lcars-blue-1);
        }

        .lcars-top-bar .title-area .agent-name {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            color: var(--lcars-blue-3);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .lcars-top-bar .title-area .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--lcars-success);
            animation: statusPulse 2s ease-in-out infinite;
        }

        .lcars-top-bar .title-area .status-indicator.offline {
            background: var(--lcars-error);
            animation: none;
        }

        .lcars-top-bar .bar-seg-4 { width: 60px; background: var(--lcars-purple-1); }
        .lcars-top-bar .bar-seg-5 { width: 40px; background: var(--lcars-blue-1); }

        .lcars-top-bar .endcap-right {
            width: 80px;
            background: var(--lcars-pink-1);
            border-radius: 0 0 24px 0;
            flex-shrink: 0;
        }

        /* ========== SIDEBAR ========== */

        .lcars-sidebar {
            grid-row: 2 / 3;
            grid-column: 1 / 2;
            background: var(--lcars-bg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-width: thin;
            scrollbar-color: var(--lcars-grey-1) transparent;
        }

        .lcars-sidebar::-webkit-scrollbar { width: 4px; }
        .lcars-sidebar::-webkit-scrollbar-track { background: transparent; }
        .lcars-sidebar::-webkit-scrollbar-thumb { background: var(--lcars-grey-1); border-radius: 2px; }

        /* Sidebar bar blocks */
        .sidebar-bars {
            display: flex;
            flex-direction: column;
            gap: var(--bar-gap);
            padding-right: 8px;
        }

        .sidebar-bar {
            height: 20px;
            border-radius: 0 10px 10px 0;
            flex-shrink: 0;
        }

        .sidebar-bar.sb-1 { background: var(--lcars-blue-2); height: 32px; }
        .sidebar-bar.sb-2 { background: var(--lcars-purple-1); height: 24px; }
        .sidebar-bar.sb-3 { background: var(--lcars-purple-2); height: 16px; }
        .sidebar-bar.sb-4 { background: var(--lcars-blue-1); height: 20px; }

        /* Sidebar data sections */
        .sidebar-data {
            padding: 12px 12px 12px 8px;
            flex: 1;
        }

        .sidebar-section {
            margin-bottom: 16px;
        }

        .sidebar-section-title {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--lcars-purple-3);
            margin-bottom: 6px;
            padding-bottom: 3px;
            border-bottom: 1px solid var(--lcars-grey-1);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 3px 0;
            font-size: 11px;
        }

        .data-row .label {
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--lcars-grey-4);
            font-size: 10px;
        }

        .data-row .value {
            font-family: var(--font-mono);
            color: var(--lcars-blue-3);
            font-size: 11px;
            text-align: right;
            max-width: 110px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .data-row .dot-indicator {
            width: 6px;
            height: 6px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .data-row .dot-indicator.on { background: var(--lcars-success); }
        .data-row .dot-indicator.off { background: var(--lcars-error); }

        /* Sidebar action button */
        .sidebar-action-btn {
            background: var(--lcars-grey-1);
            border: none;
            border-radius: 4px;
            color: var(--lcars-text);
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 5px 10px;
            cursor: pointer;
            transition: background 0.15s;
            margin-top: 6px;
            width: 100%;
        }

        .sidebar-action-btn:hover {
            background: var(--lcars-grey-2);
        }

        .sidebar-task-count {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--lcars-warning);
            margin-left: 4px;
        }

        /* Theme selector */
        .theme-select {
            width: 100%;
            margin-top: 6px;
            background: var(--lcars-grey-1);
            border: 1px solid var(--lcars-grey-2);
            border-radius: 4px;
            color: var(--lcars-text);
            font-family: var(--font-display);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 6px;
            cursor: pointer;
        }

        .theme-select option {
            background: var(--lcars-bg);
            color: var(--lcars-text);
        }

        /* GPU gauge */
        .gpu-gauge {
            margin-top: 4px;
        }

        .gauge-bar {
            height: 6px;
            background: var(--lcars-grey-1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 3px;
        }

        .gauge-bar .fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }

        .gauge-bar .fill.blue { background: var(--lcars-blue-1); }
        .gauge-bar .fill.purple { background: var(--lcars-purple-1); }
        .gauge-bar .fill.pink { background: var(--lcars-pink-1); }

        /* ========== MAIN CONTENT ========== */

        .lcars-content {
            grid-row: 2 / 3;
            grid-column: 2 / 3;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border-left: 3px solid var(--lcars-blue-2);
        }

        /* ========== MESSAGES ========== */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--lcars-grey-1) transparent;
        }

        .messages::-webkit-scrollbar { width: 6px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--lcars-grey-1); border-radius: 3px; }

        .msg {
            max-width: 80%;
            padding: 10px 14px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: msgSlideIn 0.25s ease-out;
            border-radius: 2px;
            position: relative;
        }

        @keyframes msgSlideIn {
            from { opacity: 0; transform: translateX(-12px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .msg.agent {
            align-self: flex-start;
            background: rgba(59, 130, 246, 0.08);
            border-left: 3px solid var(--lcars-blue-1);
            color: var(--lcars-text);
        }

        .msg.user {
            align-self: flex-end;
            background: rgba(139, 92, 246, 0.08);
            border-right: 3px solid var(--lcars-purple-1);
            text-align: right;
        }

        .msg.system {
            align-self: center;
            background: rgba(107, 114, 128, 0.2);
            font-family: var(--font-display);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--lcars-grey-4);
            padding: 5px 16px;
            border-radius: 12px;
        }

        .msg.error-msg {
            align-self: center;
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--lcars-error);
            font-family: var(--font-display);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--lcars-error);
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .msg.error-msg .retry-btn {
            background: var(--lcars-error);
            border: none;
            border-radius: 4px;
            color: #000;
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 4px 10px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .msg.error-msg .retry-btn:hover {
            background: var(--lcars-pink-3);
        }

        .msg .sender {
            font-family: var(--font-display);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--lcars-blue-3);
            margin-bottom: 4px;
        }

        .msg.user .sender {
            color: var(--lcars-purple-3);
        }

        .msg.wellness {
            border-left: 3px solid var(--lcars-warning);
        }

        /* Copy button on agent messages */
        .msg-copy-btn {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--lcars-grey-1);
            border: none;
            border-radius: 3px;
            color: var(--lcars-text-dim);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s;
        }

        .msg.agent:hover .msg-copy-btn {
            opacity: 0.7;
        }

        .msg-copy-btn:hover {
            opacity: 1 !important;
            background: var(--lcars-grey-2);
        }

        .msg-copy-btn.copied {
            background: var(--lcars-success);
            color: #000;
            opacity: 1 !important;
        }

        /* Markdown content inside messages */
        .msg-content p { margin: 0.4em 0; }
        .msg-content p:first-child { margin-top: 0; }
        .msg-content p:last-child { margin-bottom: 0; }

        .msg-content code {
            background: rgba(255, 255, 255, 0.08);
            padding: 1px 5px;
            border-radius: 3px;
            font-family: var(--font-mono);
            font-size: 0.9em;
        }

        .msg-content pre {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--lcars-grey-1);
            border-radius: 4px;
            padding: 10px 12px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .msg-content pre > code {
            background: none;
            padding: 0;
            font-size: 0.85em;
            line-height: 1.5;
        }

        .msg-content a {
            color: var(--lcars-blue-3);
            text-decoration: underline;
        }

        .msg-content ul, .msg-content ol {
            margin: 6px 0;
            padding-left: 20px;
        }

        .msg-content li { margin: 2px 0; }

        .msg-content blockquote {
            border-left: 3px solid var(--lcars-grey-2);
            padding-left: 12px;
            color: var(--lcars-text-dim);
            margin: 6px 0;
        }

        .msg-content table {
            border-collapse: collapse;
            margin: 8px 0;
            font-size: 0.9em;
        }

        .msg-content th, .msg-content td {
            border: 1px solid var(--lcars-grey-1);
            padding: 4px 8px;
            text-align: left;
        }

        .msg-content th {
            background: rgba(255, 255, 255, 0.05);
            font-weight: 600;
        }

        .msg-content h1, .msg-content h2, .msg-content h3,
        .msg-content h4, .msg-content h5, .msg-content h6 {
            margin: 0.6em 0 0.3em 0;
            font-family: var(--font-display);
            color: var(--lcars-blue-3);
        }

        .msg-content h1 { font-size: 1.3em; }
        .msg-content h2 { font-size: 1.15em; }
        .msg-content h3 { font-size: 1.05em; }

        /* Typing indicator */
        .typing {
            align-self: flex-start;
            padding: 8px 0;
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--lcars-blue-3);
            animation: typingBounce 1.2s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.15s; }
        .typing-dot:nth-child(3) { animation-delay: 0.3s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ========== BOTTOM BAR ========== */

        .lcars-bottom-bar {
            grid-column: 1 / -1;
            display: flex;
            align-items: stretch;
            gap: var(--bar-gap);
        }

        /* Elbow connector */
        .lcars-elbow {
            width: var(--sidebar-width);
            position: relative;
            flex-shrink: 0;
            background: var(--lcars-bg);
        }

        .lcars-elbow .elbow-outer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--lcars-purple-1);
            border-radius: 0 var(--elbow-radius) 0 0;
        }

        .lcars-elbow .elbow-inner {
            position: absolute;
            bottom: 0;
            right: 0;
            width: calc(100% - 32px);
            height: calc(100% - 32px);
            background: var(--lcars-bg);
            border-radius: 0 var(--elbow-radius) 0 0;
        }

        /* Bottom bar segments */
        .lcars-bottom-bar .bar-seg-b1 {
            width: 60px;
            background: var(--lcars-purple-2);
            flex-shrink: 0;
        }

        .lcars-bottom-bar .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--lcars-bg);
            border-top: 3px solid var(--lcars-purple-1);
            position: relative;
        }

        .lcars-bottom-bar .input-wrapper textarea {
            flex: 1;
            background: #111111;
            border: 1px solid var(--lcars-grey-1);
            border-radius: 4px;
            color: var(--lcars-text);
            padding: 8px 12px;
            font-size: 14px;
            font-family: var(--font-body);
            resize: none;
            max-height: 100px;
            min-height: 38px;
            line-height: 1.4;
            outline: none;
            transition: border-color 0.15s;
        }

        .lcars-bottom-bar .input-wrapper textarea:focus {
            border-color: var(--lcars-blue-1);
        }

        .lcars-bottom-bar .input-wrapper textarea::placeholder {
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--lcars-grey-2);
            font-size: 12px;
        }

        /* Mic button */
        .mic-btn {
            background: var(--lcars-grey-1);
            border: none;
            border-radius: 4px;
            color: var(--lcars-text);
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 10px 12px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }

        .mic-btn:hover {
            background: var(--lcars-grey-2);
        }

        .mic-btn.recording {
            background: var(--lcars-error);
            color: #000;
            animation: micPulse 1s ease-in-out infinite;
        }

        .mic-btn.transcribing {
            background: var(--lcars-warning);
            color: #000;
            cursor: wait;
        }

        @keyframes micPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .transmit-btn {
            background: var(--lcars-pink-1);
            border: none;
            border-radius: 4px;
            color: #000;
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 10px 18px;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s, color 0.15s;
        }

        .transmit-btn:hover {
            background: var(--lcars-pink-3);
            color: #000;
        }

        .transmit-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .lcars-bottom-bar .bar-seg-b2 {
            width: 40px;
            background: var(--lcars-blue-1);
            flex-shrink: 0;
            border-radius: 0 0 24px 0;
        }

        /* ========== COMMAND POPUP ========== */

        .cmd-popup {
            position: absolute;
            bottom: 100%;
            left: 12px;
            right: 12px;
            background: var(--lcars-surface);
            border: 1px solid var(--lcars-grey-1);
            border-radius: 6px;
            max-height: 240px;
            overflow-y: auto;
            display: none;
            z-index: 50;
            box-shadow: 0 -4px 16px rgba(0,0,0,0.5);
        }

        .cmd-popup.open {
            display: block;
        }

        .cmd-popup-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            gap: 10px;
            align-items: baseline;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .cmd-popup-item:last-child {
            border-bottom: none;
        }

        .cmd-popup-item:hover, .cmd-popup-item.active {
            background: rgba(59, 130, 246, 0.15);
        }

        .cmd-popup-item .cmd-name {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--lcars-blue-3);
            flex-shrink: 0;
        }

        .cmd-popup-item .cmd-desc {
            font-size: 11px;
            color: var(--lcars-text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ========== PANEL OVERLAY ========== */

        .panel-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 299;
            display: none;
            backdrop-filter: blur(2px);
        }

        .panel-overlay.open {
            display: block;
        }

        .panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(600px, 92vw);
            max-height: 80vh;
            background: var(--lcars-bg);
            border: 2px solid var(--lcars-blue-1);
            border-radius: 8px;
            z-index: 300;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .panel.open {
            display: flex;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--lcars-blue-1);
            color: #000;
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            flex-shrink: 0;
        }

        .panel-header .panel-close-btn {
            background: none;
            border: none;
            color: #000;
            font-size: 20px;
            cursor: pointer;
            padding: 0 4px;
            line-height: 1;
        }

        .panel-header .panel-back-btn {
            background: none;
            border: none;
            color: #000;
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 2px 8px;
        }

        .panel-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--lcars-grey-1) transparent;
        }

        /* ========== TASK PANEL ========== */

        .task-add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .task-add-row input {
            flex: 1;
            background: var(--lcars-surface);
            border: 1px solid var(--lcars-grey-1);
            border-radius: 4px;
            color: var(--lcars-text);
            padding: 8px 10px;
            font-family: var(--font-body);
            font-size: 13px;
            outline: none;
        }

        .task-add-row input:focus {
            border-color: var(--lcars-blue-1);
        }

        .task-add-row select {
            background: var(--lcars-surface);
            border: 1px solid var(--lcars-grey-1);
            border-radius: 4px;
            color: var(--lcars-text);
            padding: 4px 8px;
            font-family: var(--font-display);
            font-size: 11px;
            text-transform: uppercase;
            cursor: pointer;
        }

        .task-add-row button {
            background: var(--lcars-blue-1);
            border: none;
            border-radius: 4px;
            color: #000;
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 14px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .task-item .task-priority {
            width: 4px;
            height: 24px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .task-item .task-priority.high { background: var(--lcars-warning); }
        .task-item .task-priority.normal { background: var(--lcars-text-dim); }
        .task-item .task-priority.low { background: var(--lcars-grey-2); }

        .task-item .task-text {
            flex: 1;
            font-size: 13px;
        }

        .task-item .task-actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .task-item .task-actions button {
            background: var(--lcars-grey-1);
            border: none;
            border-radius: 3px;
            color: var(--lcars-text-dim);
            font-family: var(--font-display);
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 8px;
            cursor: pointer;
        }

        .task-item .task-actions button:hover {
            background: var(--lcars-grey-2);
        }

        .task-item .task-actions .done-btn:hover {
            background: var(--lcars-success);
            color: #000;
        }

        .task-empty {
            text-align: center;
            color: var(--lcars-text-dim);
            font-size: 12px;
            padding: 24px;
        }

        /* ========== HISTORY PANEL ========== */

        .history-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.1s;
        }

        .history-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .history-item .history-date {
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--lcars-blue-3);
            flex-shrink: 0;
        }

        .history-item .history-id {
            font-size: 11px;
            color: var(--lcars-text-dim);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-transcript {
            font-size: 13px;
            line-height: 1.7;
        }

        .history-empty {
            text-align: center;
            color: var(--lcars-text-dim);
            font-size: 12px;
            padding: 24px;
        }

        /* ========== PROTOCOL PANEL ========== */

        .proto-detail-item {
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding: 12px 0;
        }

        .proto-detail-item:last-child {
            border-bottom: none;
        }

        .proto-detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .proto-detail-name {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--lcars-blue-3);
        }

        .proto-toggle {
            position: relative;
            width: 40px;
            height: 20px;
            cursor: pointer;
        }

        .proto-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .proto-toggle .toggle-slider {
            position: absolute;
            inset: 0;
            background: var(--lcars-grey-1);
            border-radius: 10px;
            transition: background 0.2s;
        }

        .proto-toggle .toggle-slider::before {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            left: 2px;
            top: 2px;
            background: var(--lcars-text);
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .proto-toggle input:checked + .toggle-slider {
            background: var(--lcars-success);
        }

        .proto-toggle input:checked + .toggle-slider::before {
            transform: translateX(20px);
        }

        .proto-toggle.locked {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .proto-detail-desc {
            font-size: 12px;
            color: var(--lcars-text-dim);
            margin-bottom: 8px;
        }

        .proto-detail-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
        }

        .proto-stat {
            font-size: 11px;
        }

        .proto-stat .stat-label {
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--lcars-grey-4);
            font-size: 9px;
        }

        .proto-stat .stat-value {
            font-family: var(--font-mono);
            color: var(--lcars-blue-3);
        }

        .proto-commands {
            margin-top: 8px;
        }

        .proto-cmd {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--lcars-purple-3);
            padding: 2px 0;
        }

        .proto-cmd .cmd-slash {
            color: var(--lcars-grey-4);
        }

        /* ========== GPU PANEL ========== */

        .gpu-detail-section {
            margin-bottom: 16px;
        }

        .gpu-detail-title {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--lcars-purple-3);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--lcars-grey-1);
        }

        .gpu-big-gauge {
            height: 12px;
            background: var(--lcars-grey-1);
            border-radius: 6px;
            overflow: hidden;
            margin: 8px 0;
        }

        .gpu-big-gauge .fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        /* ========== PACK PANEL ========== */

        .pack-type-section {
            margin-bottom: 20px;
        }

        .pack-type-title {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--lcars-purple-3);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--lcars-grey-1);
        }

        .pack-list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            transition: background 0.1s;
        }

        .pack-list-item:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .pack-list-item .pack-name {
            font-family: var(--font-display);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--lcars-text);
        }

        .pack-list-item .pack-active {
            font-family: var(--font-mono);
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--lcars-success);
            background: rgba(34, 197, 94, 0.15);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .pack-detail-field {
            padding: 4px 0;
            font-size: 12px;
        }

        .pack-detail-field .field-label {
            font-family: var(--font-display);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--lcars-grey-4);
            font-size: 10px;
        }

        .pack-detail-field .field-value {
            color: var(--lcars-text);
            margin-top: 2px;
        }

        /* ========== SYSTEM PANEL ========== */

        .sys-detail-section {
            margin-bottom: 16px;
        }

        .sys-detail-title {
            font-family: var(--font-display);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--lcars-purple-3);
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--lcars-grey-1);
        }

        /* ========== SCAN LINE ========== */

        .lcars-scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(59, 130, 246, 0.06) 20%,
                rgba(59, 130, 246, 0.15) 50%,
                rgba(59, 130, 246, 0.06) 80%,
                transparent 100%
            );
            animation: scanSweep 8s linear infinite;
            pointer-events: none;
            z-index: 1000;
        }

        @keyframes scanSweep {
            0% { top: 0; }
            100% { top: 100vh; }
        }

        /* ========== STATUS PULSE ========== */

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ========== BAR SHIMMER ========== */

        @keyframes barShimmer {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }

        .shimmer {
            animation: barShimmer 3s ease-in-out infinite;
        }

        /* ========== SIDEBAR OVERLAY (mobile) ========== */

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 199;
            display: none;
            backdrop-filter: blur(2px);
        }

        .sidebar-overlay.open { display: block; }

        /* ========== PREFERS REDUCED MOTION ========== */

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .lcars-scan-line { display: none !important; }
        }

        /* ========== RESPONSIVE: TABLET (768-1023px) ========== */

        @media (max-width: 1023px) {
            :root {
                --sidebar-width: 170px;
            }

            .lcars-top-bar .bar-seg-1 { width: 50px; }
            .lcars-top-bar .bar-seg-2 { width: 24px; }
            .lcars-top-bar .bar-seg-4 { width: 30px; }
            .lcars-top-bar .bar-seg-5 { width: 24px; }
            .lcars-top-bar .endcap-right { width: 50px; }
        }

        /* ========== RESPONSIVE: MOBILE (<768px) ========== */

        @media (max-width: 767px) {
            .lcars-frame {
                grid-template-columns: 1fr;
                grid-template-rows: var(--top-bar-height) 1fr var(--bottom-bar-height);
            }

            /* Top bar: simplified */
            .lcars-top-bar .endcap-left {
                width: auto;
                padding: 0 12px;
                border-radius: 0;
            }

            .lcars-top-bar .endcap-left .hamburger {
                display: block;
            }

            .lcars-top-bar .bar-seg-1,
            .lcars-top-bar .bar-seg-2,
            .lcars-top-bar .bar-seg-3,
            .lcars-top-bar .bar-seg-4,
            .lcars-top-bar .bar-seg-5 {
                display: none;
            }

            .lcars-top-bar .title-area {
                border-bottom-width: 2px;
            }

            .lcars-top-bar .title-area .agent-name {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .lcars-top-bar .endcap-right {
                width: 50px;
                border-radius: 0;
            }

            /* Sidebar: hidden, slides from left as overlay */
            .lcars-sidebar {
                position: fixed;
                top: 0;
                left: -280px;
                width: 280px;
                height: 100%;
                z-index: 200;
                background: var(--lcars-bg);
                border-right: 3px solid var(--lcars-blue-2);
                transition: left 0.25s ease;
                padding-top: var(--top-bar-height);
            }

            .lcars-sidebar.open {
                left: 0;
            }

            /* Content: full width */
            .lcars-content {
                grid-column: 1;
                border-left: none;
            }

            /* Bottom bar: no elbow */
            .lcars-elbow { display: none; }
            .lcars-bottom-bar .bar-seg-b1 { display: none; }

            .lcars-bottom-bar {
                grid-column: 1;
            }

            .lcars-bottom-bar .input-wrapper {
                border-top-width: 2px;
            }

            .lcars-bottom-bar .bar-seg-b2 {
                width: 8px;
                border-radius: 0;
            }

            .transmit-btn {
                padding: 10px 12px;
                font-size: 11px;
                letter-spacing: 1px;
            }

            .msg { max-width: 90%; }

            /* Copy button always slightly visible on mobile */
            .msg.agent .msg-copy-btn {
                opacity: 0.4;
            }
        }

        /* ========== SAFE AREA (notched phones) ========== */

        @supports (padding: env(safe-area-inset-bottom)) {
            .lcars-bottom-bar .input-wrapper {
                padding-bottom: calc(6px + env(safe-area-inset-bottom));
            }
            .lcars-top-bar {
                padding-top: env(safe-area-inset-top);
            }
        }

        /* ========== MOBILE SIDEBAR CLOSE ========== */

        .sidebar-close {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: var(--lcars-grey-4);
            font-size: 24px;
            cursor: pointer;
            z-index: 201;
        }

        @media (max-width: 767px) {
            .sidebar-close { display: block; }
        }
    </style>
</head>
<body>

<div class="lcars-frame">

    <!-- ===== TOP BAR ===== -->
    <div class="lcars-top-bar" role="banner">
        <div class="endcap-left">
            <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle sidebar">&#9776;</button>
            <span class="top-endcap-label" style="font-family:var(--font-display);font-size:13px;font-weight:700;color:#000;letter-spacing:1px;display:none;">AEGIS</span>
        </div>
        <div class="bar-segment bar-seg-1 shimmer"></div>
        <div class="bar-segment bar-seg-2"></div>
        <div class="bar-segment bar-seg-3"></div>
        <div class="title-area">
            <span class="agent-name" id="agentName">AEGIS</span>
            <div class="status-indicator" id="statusDot" aria-label="Connection status: online"></div>
        </div>
        <div class="bar-segment bar-seg-4"></div>
        <div class="bar-segment bar-seg-5 shimmer"></div>
        <div class="endcap-right"></div>
    </div>

    <!-- ===== SIDEBAR ===== -->
    <div class="lcars-sidebar" id="sidebar" role="complementary" aria-label="System information">
        <button class="sidebar-close" onclick="toggleSidebar()" aria-label="Close sidebar">&times;</button>

        <div class="sidebar-bars">
            <div class="sidebar-bar sb-1"></div>
            <div class="sidebar-bar sb-2 shimmer"></div>
            <div class="sidebar-bar sb-3"></div>
            <div class="sidebar-bar sb-4 shimmer"></div>
        </div>

        <div class="sidebar-data">
            <div class="sidebar-section">
                <div class="sidebar-section-title">System</div>
                <div id="sysInfo">
                    <div class="data-row"><span class="label">Status</span><span class="value">Loading...</span></div>
                </div>
                <button class="sidebar-action-btn" onclick="openSystemPanel()" aria-label="System details">DETAILS</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Protocols</div>
                <div id="protoList"></div>
                <button class="sidebar-action-btn" onclick="openProtocolPanel()" aria-label="Protocol controls">CONTROLS</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Packs</div>
                <div id="packList"></div>
                <select class="theme-select" id="themeSelect" aria-label="Select theme" onchange="switchTheme(this.value)">
                    <option value="">-- theme --</option>
                </select>
                <button class="sidebar-action-btn" onclick="openPackPanel()" aria-label="Pack details">INSPECT</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">Tasks <span class="sidebar-task-count" id="taskCount"></span></div>
                <button class="sidebar-action-btn" onclick="openTaskPanel()" aria-label="Manage tasks">MANAGE</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">History</div>
                <button class="sidebar-action-btn" onclick="openHistoryPanel()" aria-label="Browse session history">BROWSE</button>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-section-title">GPU</div>
                <div id="gpuInfo">
                    <div class="data-row"><span class="label">Status</span><span class="value">--</span></div>
                </div>
                <button class="sidebar-action-btn" onclick="openGpuPanel()" aria-label="GPU monitor">MONITOR</button>
            </div>
        </div>
    </div>

    <!-- ===== CONTENT AREA ===== -->
    <div class="lcars-content" role="main">
        <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Chat messages">
            <div class="msg system" id="connectMsg">CHANNEL OPEN</div>
        </div>
    </div>

    <!-- ===== BOTTOM BAR ===== -->
    <div class="lcars-bottom-bar">
        <div class="lcars-elbow">
            <div class="elbow-outer"></div>
            <div class="elbow-inner"></div>
        </div>
        <div class="bar-seg-b1"></div>
        <div class="input-wrapper">
            <div class="cmd-popup" id="cmdPopup" role="listbox" aria-label="Command suggestions"></div>
            <textarea id="input" placeholder="ENTER QUERY..." rows="1" aria-label="Message input"
                      onkeydown="handleKey(event)" oninput="handleInput(this)"></textarea>
            <button class="mic-btn" id="micBtn" onclick="toggleMic()" aria-label="Voice input">MIC</button>
            <button class="transmit-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send message">TRANSMIT</button>
        </div>
        <div class="bar-seg-b2 shimmer"></div>
    </div>

</div>

<!-- Scan line overlay -->
<div class="lcars-scan-line" id="scanLine"></div>

<!-- Sidebar overlay for mobile -->
<div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

<!-- Task Panel -->
<div class="panel-overlay" id="taskPanelOverlay" onclick="closeTaskPanel()"></div>
<div class="panel" id="taskPanel" role="dialog" aria-label="Task manager">
    <div class="panel-header">
        <span>Task Manager</span>
        <button class="panel-close-btn" onclick="closeTaskPanel()" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
        <div class="task-add-row">
            <input type="text" id="taskInput" placeholder="New task..." aria-label="New task text"
                   onkeydown="if(event.key==='Enter'){addTask();}">
            <select id="taskPriority" aria-label="Task priority">
                <option value="normal">Normal</option>
                <option value="high">High</option>
                <option value="low">Low</option>
            </select>
            <button onclick="addTask()">ADD</button>
        </div>
        <div id="taskList"></div>
    </div>
</div>

<!-- History Panel -->
<div class="panel-overlay" id="historyPanelOverlay" onclick="closeHistoryPanel()"></div>
<div class="panel" id="historyPanel" role="dialog" aria-label="Session history">
    <div class="panel-header">
        <span id="historyTitle">Session History</span>
        <div>
            <button class="panel-back-btn" id="historyBackBtn" onclick="historyBack()" style="display:none;" aria-label="Back to list">BACK</button>
            <button class="panel-close-btn" onclick="closeHistoryPanel()" aria-label="Close">&times;</button>
        </div>
    </div>
    <div class="panel-body">
        <div id="historyContent"></div>
    </div>
</div>

<!-- Protocol Controls Panel -->
<div class="panel-overlay" id="protoPanelOverlay" onclick="closeProtocolPanel()"></div>
<div class="panel" id="protoPanel" role="dialog" aria-label="Protocol controls">
    <div class="panel-header">
        <span>Protocol Controls</span>
        <button class="panel-close-btn" onclick="closeProtocolPanel()" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
        <div id="protoDetailList"></div>
    </div>
</div>

<!-- GPU Monitor Panel -->
<div class="panel-overlay" id="gpuPanelOverlay" onclick="closeGpuPanel()"></div>
<div class="panel" id="gpuPanel" role="dialog" aria-label="GPU monitor">
    <div class="panel-header">
        <span>GPU Monitor</span>
        <button class="panel-close-btn" onclick="closeGpuPanel()" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
        <div id="gpuDetailContent"></div>
    </div>
</div>

<!-- Pack Manager Panel -->
<div class="panel-overlay" id="packPanelOverlay" onclick="closePackPanel()"></div>
<div class="panel" id="packPanel" role="dialog" aria-label="Pack manager">
    <div class="panel-header">
        <span id="packPanelTitle">Pack Manager</span>
        <div>
            <button class="panel-back-btn" id="packBackBtn" onclick="packBack()" style="display:none;" aria-label="Back to list">BACK</button>
            <button class="panel-close-btn" onclick="closePackPanel()" aria-label="Close">&times;</button>
        </div>
    </div>
    <div class="panel-body">
        <div id="packDetailContent"></div>
    </div>
</div>

<!-- System Info Panel -->
<div class="panel-overlay" id="systemPanelOverlay" onclick="closeSystemPanel()"></div>
<div class="panel" id="systemPanel" role="dialog" aria-label="System information">
    <div class="panel-header">
        <span>System Information</span>
        <button class="panel-close-btn" onclick="closeSystemPanel()" aria-label="Close">&times;</button>
    </div>
    <div class="panel-body">
        <div id="systemDetailContent"></div>
    </div>
</div>

<script>
// ========== CONFIG ==========

const API = window.location.origin + '/api';
let sending = false;
let currentTheme = null;
let serverOnline = true;
let commands = [];
let cmdPopupIndex = -1;
let lastFailedMessage = null;

// Configure marked
if (typeof marked !== 'undefined') {
    marked.setOptions({ breaks: true, gfm: true });
}

// ========== THEME LOADING ==========

async function loadTheme() {
    try {
        const res = await fetch(API + '/theme');
        const theme = await res.json();
        currentTheme = theme;
        applyTheme(theme);
    } catch (e) {
        // Theme load failed -- defaults are already in CSS
    }
}

function applyTheme(theme) {
    if (!theme) return;
    const root = document.documentElement;

    // Apply colors as CSS custom properties
    const colors = theme.colors || {};
    const colorMap = {
        'background': '--lcars-bg',
        'surface': '--lcars-surface',
        'text': '--lcars-text',
        'text_dim': '--lcars-text-dim',
        'blue_1': '--lcars-blue-1',
        'blue_2': '--lcars-blue-2',
        'blue_3': '--lcars-blue-3',
        'purple_1': '--lcars-purple-1',
        'purple_2': '--lcars-purple-2',
        'purple_3': '--lcars-purple-3',
        'pink_1': '--lcars-pink-1',
        'pink_2': '--lcars-pink-2',
        'pink_3': '--lcars-pink-3',
        'grey_1': '--lcars-grey-1',
        'grey_2': '--lcars-grey-2',
        'grey_3': '--lcars-grey-3',
        'grey_4': '--lcars-grey-4',
        'success': '--lcars-success',
        'warning': '--lcars-warning',
        'error': '--lcars-error',
    };

    for (const [key, prop] of Object.entries(colorMap)) {
        if (colors[key]) root.style.setProperty(prop, colors[key]);
    }

    // Apply layout as CSS variables
    const layout = theme.layout || {};
    const layoutMap = {
        'sidebar_width': '--sidebar-width',
        'top_bar_height': '--top-bar-height',
        'bottom_bar_height': '--bottom-bar-height',
        'elbow_radius': '--elbow-radius',
        'bar_gap': '--bar-gap',
    };

    for (const [key, prop] of Object.entries(layoutMap)) {
        if (layout[key]) root.style.setProperty(prop, layout[key]);
    }

    // Apply fonts
    const fonts = theme.fonts || {};
    if (fonts.display) root.style.setProperty('--font-display', fonts.display);
    if (fonts.body) root.style.setProperty('--font-body', fonts.body);
    if (fonts.mono) root.style.setProperty('--font-mono', fonts.mono);

    // Apply terminology
    const terms = theme.terminology || {};
    if (terms.input_placeholder) {
        document.getElementById('input').placeholder = terms.input_placeholder;
    }
    if (terms.send_label) {
        document.getElementById('sendBtn').textContent = terms.send_label;
    }
    if (terms.connected_label) {
        const connectMsg = document.getElementById('connectMsg');
        if (connectMsg) connectMsg.textContent = terms.connected_label;
    }
    if (terms.title) {
        document.title = terms.title;
    }

    // Apply animations
    const anims = theme.animations || {};
    const scanLine = document.getElementById('scanLine');
    if (scanLine) {
        scanLine.style.display = anims.scan_line ? '' : 'none';
        if (anims.scan_speed) {
            scanLine.style.animationDuration = anims.scan_speed;
        }
    }

    // Shimmer
    document.querySelectorAll('.shimmer').forEach(function(el) {
        if (anims.bar_shimmer === false) {
            el.style.animationName = 'none';
        } else {
            el.style.animationName = '';
        }
    });
}

// ========== MESSAGING ==========

async function sendMessage(retryText) {
    const input = document.getElementById('input');
    const text = retryText || input.value.trim();
    if (!text || sending) return;

    sending = true;
    document.getElementById('sendBtn').disabled = true;
    closeCmdPopup();

    if (!retryText) {
        addMessage(text, 'user');
        input.value = '';
        input.style.height = '38px';
    }

    const typing = showTyping();

    try {
        const res = await fetch(API + '/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text}),
        });
        const data = await res.json();
        removeTyping(typing);
        addMessage(data.response, 'agent', data.agent_name, data.wellness_flag);
        lastFailedMessage = null;
    } catch (e) {
        removeTyping(typing);
        lastFailedMessage = text;
        addErrorMessage('SIGNAL LOST -- VERIFY SERVER STATUS', text);
    }

    sending = false;
    document.getElementById('sendBtn').disabled = false;
    input.focus();
}

function addMessage(text, type, sender, wellness) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg ' + type + (wellness ? ' wellness' : '');

    if (type === 'agent' && sender) {
        const senderDiv = document.createElement('div');
        senderDiv.className = 'sender';
        senderDiv.textContent = sender.toUpperCase();
        div.appendChild(senderDiv);

        const contentDiv = document.createElement('div');
        contentDiv.className = 'msg-content';
        if (typeof marked !== 'undefined') {
            contentDiv.innerHTML = marked.parse(text);
        } else {
            contentDiv.innerHTML = escapeHtml(text);
        }
        div.appendChild(contentDiv);

        // Copy button
        const rawText = text;
        const copyBtn = document.createElement('button');
        copyBtn.className = 'msg-copy-btn';
        copyBtn.textContent = 'COPY';
        copyBtn.setAttribute('aria-label', 'Copy message');
        copyBtn.onclick = function() {
            navigator.clipboard.writeText(rawText).then(function() {
                copyBtn.textContent = 'COPIED';
                copyBtn.classList.add('copied');
                setTimeout(function() {
                    copyBtn.textContent = 'COPY';
                    copyBtn.classList.remove('copied');
                }, 1500);
            });
        };
        div.appendChild(copyBtn);

        // Store raw text for copy
        div.dataset.rawText = rawText;
    } else {
        div.textContent = text;
    }

    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

function addErrorMessage(text, failedMsg) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'msg error-msg';

    const span = document.createElement('span');
    span.textContent = text;
    div.appendChild(span);

    if (failedMsg) {
        const retryBtn = document.createElement('button');
        retryBtn.className = 'retry-btn';
        retryBtn.textContent = 'RETRY';
        retryBtn.setAttribute('aria-label', 'Retry sending message');
        retryBtn.onclick = function() {
            div.remove();
            sendMessage(failedMsg);
        };
        div.appendChild(retryBtn);
    }

    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'typing';
    div.setAttribute('aria-label', 'Agent is typing');
    div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
}

function removeTyping(el) {
    if (el && el.parentNode) el.parentNode.removeChild(el);
}

function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function handleKey(e) {
    // Command popup keyboard nav
    const popup = document.getElementById('cmdPopup');
    if (popup.classList.contains('open')) {
        const items = popup.querySelectorAll('.cmd-popup-item');
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            cmdPopupIndex = Math.min(cmdPopupIndex + 1, items.length - 1);
            updateCmdPopupActive(items);
            return;
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            cmdPopupIndex = Math.max(cmdPopupIndex - 1, 0);
            updateCmdPopupActive(items);
            return;
        } else if (e.key === 'Enter' && cmdPopupIndex >= 0 && items[cmdPopupIndex]) {
            e.preventDefault();
            items[cmdPopupIndex].click();
            return;
        } else if (e.key === 'Escape') {
            e.preventDefault();
            closeCmdPopup();
            return;
        }
    }

    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function handleInput(el) {
    autoGrow(el);
    checkSlashCommand(el.value);
}

function autoGrow(el) {
    el.style.height = '38px';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ========== SLASH COMMAND HINTS ==========

async function loadCommands() {
    try {
        const res = await fetch(API + '/commands');
        if (res.ok) {
            commands = await res.json();
        }
    } catch (e) {
        commands = [];
    }
}

function checkSlashCommand(value) {
    if (!value.startsWith('/') || value.includes(' ')) {
        closeCmdPopup();
        return;
    }

    const query = value.substring(1).toLowerCase();
    const matches = commands.filter(function(c) {
        return c.command.toLowerCase().startsWith(query);
    });

    if (matches.length === 0) {
        closeCmdPopup();
        return;
    }

    const popup = document.getElementById('cmdPopup');
    popup.innerHTML = '';
    cmdPopupIndex = -1;

    matches.forEach(function(cmd) {
        const item = document.createElement('div');
        item.className = 'cmd-popup-item';
        item.setAttribute('role', 'option');
        item.innerHTML = '<span class="cmd-name">/' + escapeHtml(cmd.command) + '</span>' +
                         '<span class="cmd-desc">' + escapeHtml(cmd.description || '') + '</span>';
        item.onclick = function() {
            document.getElementById('input').value = '/' + cmd.command + ' ';
            document.getElementById('input').focus();
            closeCmdPopup();
        };
        popup.appendChild(item);
    });

    popup.classList.add('open');
}

function updateCmdPopupActive(items) {
    items.forEach(function(item, i) {
        item.classList.toggle('active', i === cmdPopupIndex);
    });
    if (items[cmdPopupIndex]) {
        items[cmdPopupIndex].scrollIntoView({ block: 'nearest' });
    }
}

function closeCmdPopup() {
    document.getElementById('cmdPopup').classList.remove('open');
    cmdPopupIndex = -1;
}

// ========== VOICE INPUT ==========

let mediaRecorder = null;
let audioChunks = [];

function toggleMic() {
    const btn = document.getElementById('micBtn');

    if (mediaRecorder && mediaRecorder.state === 'recording') {
        // Stop recording
        mediaRecorder.stop();
        return;
    }

    if (btn.classList.contains('transcribing')) return;

    // Start recording
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

        mediaRecorder.ondataavailable = function(e) {
            if (e.data.size > 0) audioChunks.push(e.data);
        };

        mediaRecorder.onstop = function() {
            stream.getTracks().forEach(function(t) { t.stop(); });
            btn.classList.remove('recording');
            btn.textContent = '...';
            btn.classList.add('transcribing');

            const blob = new Blob(audioChunks, { type: 'audio/webm' });
            const form = new FormData();
            form.append('audio', blob, 'recording.webm');

            fetch(API + '/stt', { method: 'POST', body: form })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    btn.classList.remove('transcribing');
                    btn.textContent = 'MIC';
                    if (data.text) {
                        const input = document.getElementById('input');
                        input.value = (input.value ? input.value + ' ' : '') + data.text;
                        input.focus();
                        autoGrow(input);
                    }
                })
                .catch(function() {
                    btn.classList.remove('transcribing');
                    btn.textContent = 'MIC';
                });
        };

        mediaRecorder.start();
        btn.classList.add('recording');
        btn.textContent = 'REC';
    }).catch(function(err) {
        console.error('Microphone access denied:', err);
    });
}

// ========== CONNECTION POLLING ==========

async function checkConnection() {
    try {
        const res = await fetch(API + '/status', { signal: AbortSignal.timeout(5000) });
        if (res.ok) {
            setOnlineStatus(true);
        } else {
            setOnlineStatus(false);
        }
    } catch (e) {
        setOnlineStatus(false);
    }
}

function setOnlineStatus(online) {
    const dot = document.getElementById('statusDot');
    const sendBtn = document.getElementById('sendBtn');
    serverOnline = online;

    if (online) {
        dot.classList.remove('offline');
        dot.setAttribute('aria-label', 'Connection status: online');
        sendBtn.disabled = sending;
    } else {
        dot.classList.add('offline');
        dot.setAttribute('aria-label', 'Connection status: offline');
        sendBtn.disabled = true;
    }
}

// ========== SIDEBAR ==========

function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    const isMobile = window.innerWidth < 768;

    if (isMobile) {
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    }

    loadStatus();
}

// ========== STATUS / DATA READOUTS ==========

function lcarsDataRow(label, value) {
    return '<div class="data-row"><span class="label">' + escapeHtml(label) +
           '</span><span class="value">' + escapeHtml(String(value)) + '</span></div>';
}

function lcarsProtoRow(name, enabled) {
    const dotClass = enabled ? 'on' : 'off';
    return '<div class="data-row"><span class="label">' + escapeHtml(name) +
           '</span><div class="dot-indicator ' + dotClass + '"></div></div>';
}

async function loadStatus() {
    try {
        const [statusRes, packsRes, gpuRes] = await Promise.all([
            fetch(API + '/status'),
            fetch(API + '/packs'),
            fetch(API + '/gpu').catch(function() { return null; }),
        ]);
        const status = await statusRes.json();
        const packs = await packsRes.json();

        // Update agent name
        const displayName = status.agent_name || 'AEGIS';
        document.getElementById('agentName').textContent = displayName.toUpperCase();

        // System info
        document.getElementById('sysInfo').innerHTML =
            lcarsDataRow('MODEL', status.model || '--') +
            lcarsDataRow('SESSION', (status.session_id || '--').substring(0, 8)) +
            lcarsDataRow('MESSAGES', status.message_count || 0);

        // Protocols
        document.getElementById('protoList').innerHTML =
            (status.protocols || []).map(function(p) {
                return lcarsProtoRow(p.name, p.enabled);
            }).join('');

        // Packs
        const active = packs.active || {};
        document.getElementById('packList').innerHTML =
            lcarsDataRow('PERSONA', (active.personality || '--').toUpperCase()) +
            lcarsDataRow('VOICE', (active.voice || '--').toUpperCase()) +
            lcarsDataRow('THEME', (active.theme || '--').toUpperCase());

        // Populate theme selector
        const themeSelect = document.getElementById('themeSelect');
        const themes = packs.themes || [];
        const currentActiveTheme = active.theme || 'default';

        // Only repopulate if needed
        if (themeSelect.options.length <= 1) {
            themeSelect.innerHTML = '';
            themes.forEach(function(t) {
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t.toUpperCase();
                if (t === currentActiveTheme) opt.selected = true;
                themeSelect.appendChild(opt);
            });
        }

        // GPU info
        if (gpuRes && gpuRes.ok) {
            const gpu = await gpuRes.json();
            if (gpu && !gpu.error) {
                let gpuHtml = lcarsDataRow('GPU', gpu.name || 'N/A');
                if (gpu.memory_used_mb && gpu.memory_total_mb) {
                    const pct = Math.round((gpu.memory_used_mb / gpu.memory_total_mb) * 100);
                    const color = pct > 80 ? 'pink' : pct > 50 ? 'purple' : 'blue';
                    gpuHtml += lcarsDataRow('VRAM', gpu.memory_used_mb + '/' + gpu.memory_total_mb + ' MB');
                    gpuHtml += '<div class="gpu-gauge"><div class="gauge-bar"><div class="fill ' + color + '" style="width:' + pct + '%"></div></div></div>';
                }
                if (gpu.temperature) {
                    gpuHtml += lcarsDataRow('TEMP', gpu.temperature + ' C');
                }
                document.getElementById('gpuInfo').innerHTML = gpuHtml;
            }
        }
    } catch (e) {
        // Status load failed -- keep defaults
    }
}

// ========== TASK PANEL ==========

function openTaskPanel() {
    document.getElementById('taskPanelOverlay').classList.add('open');
    document.getElementById('taskPanel').classList.add('open');
    loadTasks();
}

function closeTaskPanel() {
    document.getElementById('taskPanelOverlay').classList.remove('open');
    document.getElementById('taskPanel').classList.remove('open');
}

async function loadTasks() {
    try {
        const res = await fetch(API + '/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: 'list'}),
        });
        const data = await res.json();
        renderTasks(data.tasks || []);
        updateTaskCount(data.tasks || []);
    } catch (e) {
        document.getElementById('taskList').innerHTML = '<div class="task-empty">Could not load tasks</div>';
    }
}

function renderTasks(tasks) {
    const container = document.getElementById('taskList');
    if (tasks.length === 0) {
        container.innerHTML = '<div class="task-empty">No pending tasks</div>';
        return;
    }

    container.innerHTML = tasks.map(function(t) {
        const pClass = (t.priority || 'normal').toLowerCase();
        return '<div class="task-item">' +
            '<div class="task-priority ' + escapeHtml(pClass) + '"></div>' +
            '<div class="task-text">' + escapeHtml(t.text || t.description || '') + '</div>' +
            '<div class="task-actions">' +
                '<button class="done-btn" onclick="completeTask(' + t.id + ')" aria-label="Complete task">DONE</button>' +
                '<button onclick="removeTask(' + t.id + ')" aria-label="Remove task">X</button>' +
            '</div>' +
        '</div>';
    }).join('');
}

function updateTaskCount(tasks) {
    const el = document.getElementById('taskCount');
    el.textContent = tasks.length > 0 ? '(' + tasks.length + ')' : '';
}

async function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;

    const priority = document.getElementById('taskPriority').value;

    try {
        await fetch(API + '/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: 'add', text: text, priority: priority}),
        });
        input.value = '';
        loadTasks();
    } catch (e) {}
}

async function completeTask(id) {
    try {
        await fetch(API + '/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: 'done', task_id: id}),
        });
        loadTasks();
    } catch (e) {}
}

async function removeTask(id) {
    try {
        await fetch(API + '/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: 'remove', task_id: id}),
        });
        loadTasks();
    } catch (e) {}
}

// ========== HISTORY PANEL ==========

let historyViewingTranscript = false;

function openHistoryPanel() {
    document.getElementById('historyPanelOverlay').classList.add('open');
    document.getElementById('historyPanel').classList.add('open');
    historyViewingTranscript = false;
    document.getElementById('historyBackBtn').style.display = 'none';
    document.getElementById('historyTitle').textContent = 'Session History';
    loadSessions();
}

function closeHistoryPanel() {
    document.getElementById('historyPanelOverlay').classList.remove('open');
    document.getElementById('historyPanel').classList.remove('open');
}

function historyBack() {
    historyViewingTranscript = false;
    document.getElementById('historyBackBtn').style.display = 'none';
    document.getElementById('historyTitle').textContent = 'Session History';
    loadSessions();
}

async function loadSessions() {
    const container = document.getElementById('historyContent');
    try {
        const res = await fetch(API + '/transcripts');
        const data = await res.json();
        const sessions = data.sessions || [];

        if (sessions.length === 0) {
            container.innerHTML = '<div class="history-empty">No session history</div>';
            return;
        }

        container.innerHTML = sessions.map(function(s) {
            const sid = s.session_id || s;
            const dateStr = sid.replace(/_/g, ' ').substring(0, 16);
            return '<div class="history-item" onclick="loadTranscript(\'' + escapeHtml(sid) + '\')">' +
                '<span class="history-date">' + escapeHtml(dateStr) + '</span>' +
                '<span class="history-id">' + escapeHtml(sid) + '</span>' +
            '</div>';
        }).join('');
    } catch (e) {
        container.innerHTML = '<div class="history-empty">Could not load history</div>';
    }
}

async function loadTranscript(sessionId) {
    const container = document.getElementById('historyContent');
    container.innerHTML = '<div class="history-empty">Loading...</div>';

    try {
        const res = await fetch(API + '/transcripts/' + encodeURIComponent(sessionId));
        const data = await res.json();

        historyViewingTranscript = true;
        document.getElementById('historyBackBtn').style.display = '';
        document.getElementById('historyTitle').textContent = 'Session: ' + sessionId.substring(0, 16);

        if (data.content) {
            const rendered = (typeof marked !== 'undefined') ? marked.parse(data.content) : escapeHtml(data.content);
            container.innerHTML = '<div class="history-transcript msg-content">' + rendered + '</div>';
        } else {
            container.innerHTML = '<div class="history-empty">Transcript not found</div>';
        }
    } catch (e) {
        container.innerHTML = '<div class="history-empty">Could not load transcript</div>';
    }
}

// ========== PROTOCOL PANEL ==========

function openProtocolPanel() {
    document.getElementById('protoPanelOverlay').classList.add('open');
    document.getElementById('protoPanel').classList.add('open');
    loadProtocolDetails();
}

function closeProtocolPanel() {
    document.getElementById('protoPanelOverlay').classList.remove('open');
    document.getElementById('protoPanel').classList.remove('open');
}

async function loadProtocolDetails() {
    const container = document.getElementById('protoDetailList');
    try {
        const res = await fetch(API + '/status');
        const data = await res.json();
        const protocols = data.protocols || [];

        container.innerHTML = protocols.map(function(p) {
            const isLocked = p.name === 'security';
            const lockedClass = isLocked ? ' locked' : '';
            const checkedAttr = p.enabled ? ' checked' : '';
            const disabledAttr = isLocked ? ' disabled' : '';

            // Build stats from known fields
            var statsHtml = '';
            var knownKeys = ['name','enabled','initialized','priority','description','commands'];
            Object.keys(p).forEach(function(key) {
                if (knownKeys.indexOf(key) === -1) {
                    statsHtml += '<div class="proto-stat"><span class="stat-label">' +
                        escapeHtml(key.replace(/_/g, ' ')) + '</span> <span class="stat-value">' +
                        escapeHtml(String(p[key])) + '</span></div>';
                }
            });

            return '<div class="proto-detail-item">' +
                '<div class="proto-detail-header">' +
                    '<span class="proto-detail-name">' + escapeHtml(p.name) + '</span>' +
                    '<label class="proto-toggle' + lockedClass + '">' +
                        '<input type="checkbox"' + checkedAttr + disabledAttr +
                        ' onchange="toggleProtocol(\'' + escapeHtml(p.name) + '\', this.checked)">' +
                        '<span class="toggle-slider"></span>' +
                    '</label>' +
                '</div>' +
                '<div class="proto-detail-desc">' + escapeHtml(p.description || '') + '</div>' +
                '<div class="proto-detail-stats">' +
                    '<div class="proto-stat"><span class="stat-label">Priority</span> <span class="stat-value">' + p.priority + '</span></div>' +
                    statsHtml +
                '</div>' +
            '</div>';
        }).join('');

        // Load commands for each protocol
        protocols.forEach(function(p) {
            loadProtocolCommands(p.name);
        });
    } catch (e) {
        container.innerHTML = '<div class="task-empty">Could not load protocols</div>';
    }
}

async function loadProtocolCommands(protoName) {
    try {
        const res = await fetch(API + '/protocol/' + encodeURIComponent(protoName));
        const data = await res.json();
        if (data.commands && data.commands.length > 0) {
            // Find the matching proto-detail-item and append commands
            var items = document.querySelectorAll('.proto-detail-item');
            items.forEach(function(item) {
                var nameEl = item.querySelector('.proto-detail-name');
                if (nameEl && nameEl.textContent.toLowerCase() === protoName.toLowerCase()) {
                    var cmdHtml = '<div class="proto-commands">';
                    data.commands.forEach(function(cmd) {
                        cmdHtml += '<div class="proto-cmd"><span class="cmd-slash">/</span>' +
                            escapeHtml(cmd.command) + ' <span style="color:var(--lcars-text-dim);font-size:10px">' +
                            escapeHtml(cmd.description || '') + '</span></div>';
                    });
                    cmdHtml += '</div>';
                    item.insertAdjacentHTML('beforeend', cmdHtml);
                }
            });
        }
    } catch (e) {}
}

async function toggleProtocol(name, enabled) {
    try {
        await fetch(API + '/protocol/toggle', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({protocol_name: name, enabled: enabled}),
        });
        loadStatus();
    } catch (e) {}
}

// ========== GPU PANEL ==========

function openGpuPanel() {
    document.getElementById('gpuPanelOverlay').classList.add('open');
    document.getElementById('gpuPanel').classList.add('open');
    loadGpuDetails();
}

function closeGpuPanel() {
    document.getElementById('gpuPanelOverlay').classList.remove('open');
    document.getElementById('gpuPanel').classList.remove('open');
}

async function loadGpuDetails() {
    const container = document.getElementById('gpuDetailContent');
    try {
        const res = await fetch(API + '/gpu');
        const gpu = await res.json();

        if (gpu.error) {
            container.innerHTML = '<div class="task-empty">' + escapeHtml(gpu.error) + '</div>';
            return;
        }

        var html = '<div class="gpu-detail-section">';
        html += '<div class="gpu-detail-title">Device</div>';
        html += lcarsDataRow('GPU', gpu.name || 'N/A');
        if (gpu.driver_version) html += lcarsDataRow('DRIVER', gpu.driver_version);
        html += '</div>';

        if (gpu.memory_used_mb && gpu.memory_total_mb) {
            var pct = Math.round((gpu.memory_used_mb / gpu.memory_total_mb) * 100);
            var free = gpu.memory_total_mb - gpu.memory_used_mb;
            var color = pct > 80 ? 'pink' : pct > 50 ? 'purple' : 'blue';

            html += '<div class="gpu-detail-section">';
            html += '<div class="gpu-detail-title">VRAM</div>';
            html += lcarsDataRow('USED', gpu.memory_used_mb + ' MB');
            html += lcarsDataRow('FREE', free + ' MB');
