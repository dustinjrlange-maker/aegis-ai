            html += lcarsDataRow('TOTAL', gpu.memory_total_mb + ' MB');
            html += lcarsDataRow('USAGE', pct + '%');
            html += '<div class="gpu-big-gauge"><div class="fill ' + color + '" style="width:' + pct + '%"></div></div>';
            html += '</div>';
        }

        if (gpu.temperature || gpu.utilization !== undefined) {
            html += '<div class="gpu-detail-section">';
            html += '<div class="gpu-detail-title">Status</div>';
            if (gpu.temperature) html += lcarsDataRow('TEMP', gpu.temperature + ' C');
            if (gpu.utilization !== undefined) html += lcarsDataRow('UTIL', gpu.utilization + '%');
            if (gpu.power_draw) html += lcarsDataRow('POWER', gpu.power_draw + ' W');
            if (gpu.fan_speed !== undefined) html += lcarsDataRow('FAN', gpu.fan_speed + '%');
            html += '</div>';
        }

        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<div class="task-empty">Could not load GPU info</div>';
    }
}

// ========== PACK PANEL ==========

let packViewingDetail = false;

function openPackPanel() {
    document.getElementById('packPanelOverlay').classList.add('open');
    document.getElementById('packPanel').classList.add('open');
    packViewingDetail = false;
    document.getElementById('packBackBtn').style.display = 'none';
    document.getElementById('packPanelTitle').textContent = 'Pack Manager';
    loadPackList();
}

function closePackPanel() {
    document.getElementById('packPanelOverlay').classList.remove('open');
    document.getElementById('packPanel').classList.remove('open');
}

function packBack() {
    packViewingDetail = false;
    document.getElementById('packBackBtn').style.display = 'none';
    document.getElementById('packPanelTitle').textContent = 'Pack Manager';
    loadPackList();
}

async function loadPackList() {
    const container = document.getElementById('packDetailContent');
    try {
        const res = await fetch(API + '/packs');
        const data = await res.json();
        const active = data.active || {};

        var html = '';
        var types = [
            {key: 'personalities', label: 'Personalities', activeKey: 'personality'},
            {key: 'voices', label: 'Voices', activeKey: 'voice'},
            {key: 'themes', label: 'Themes', activeKey: 'theme'},
        ];

        types.forEach(function(t) {
            var packs = data[t.key] || [];
            html += '<div class="pack-type-section">';
            html += '<div class="pack-type-title">' + t.label + '</div>';
            packs.forEach(function(p) {
                var isActive = (p === active[t.activeKey]);
                var activeTag = isActive ? '<span class="pack-active">ACTIVE</span>' : '';
                html += '<div class="pack-list-item" onclick="loadPackDetail(\'' +
                    escapeHtml(t.key) + '\', \'' + escapeHtml(p) + '\')">' +
                    '<span class="pack-name">' + escapeHtml(p) + '</span>' +
                    activeTag + '</div>';
            });
            html += '</div>';
        });

        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<div class="task-empty">Could not load packs</div>';
    }
}

async function loadPackDetail(packType, packName) {
    const container = document.getElementById('packDetailContent');
    container.innerHTML = '<div class="task-empty">Loading...</div>';

    try {
        const res = await fetch(API + '/packs/' + encodeURIComponent(packType) + '/' + encodeURIComponent(packName));
        const data = await res.json();

        if (data.error) {
            container.innerHTML = '<div class="task-empty">' + escapeHtml(data.error) + '</div>';
            return;
        }

        packViewingDetail = true;
        document.getElementById('packBackBtn').style.display = '';
        document.getElementById('packPanelTitle').textContent = packName.toUpperCase();

        var manifest = data.manifest || {};
        var html = '<div class="gpu-detail-section">';
        html += '<div class="gpu-detail-title">Manifest</div>';

        var fields = ['name', 'character_name', 'author', 'version', 'description', 'disclaimer', 'compatibility'];
        fields.forEach(function(f) {
            if (manifest[f]) {
                html += '<div class="pack-detail-field"><div class="field-label">' +
                    escapeHtml(f.replace(/_/g, ' ')) + '</div><div class="field-value">' +
                    escapeHtml(String(manifest[f])) + '</div></div>';
            }
        });

        if (manifest.tags && manifest.tags.length > 0) {
            html += '<div class="pack-detail-field"><div class="field-label">Tags</div><div class="field-value">' +
                manifest.tags.map(function(t) { return escapeHtml(t); }).join(', ') + '</div></div>';
        }

        html += '</div>';

        if (data.files && data.files.length > 0) {
            html += '<div class="gpu-detail-section">';
            html += '<div class="gpu-detail-title">Files</div>';
            data.files.forEach(function(f) {
                html += '<div class="data-row"><span class="value" style="max-width:none">' + escapeHtml(f) + '</span></div>';
            });
            html += '</div>';
        }

        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<div class="task-empty">Could not load pack details</div>';
    }
}

// ========== SYSTEM PANEL ==========

function openSystemPanel() {
    document.getElementById('systemPanelOverlay').classList.add('open');
    document.getElementById('systemPanel').classList.add('open');

}

function closeSystemPanel() {

async function loadSystemDetails() {
    const container = document.getElementById('systemDetailContent');
    try {
        const res = await fetch(API + '/system/info');
        const info = await res.json();

        var html = '';

        // Identity
        html += '<div class="sys-detail-section">';
        html += '<div class="sys-detail-title">Identity</div>';
        html += lcarsDataRow('AGENT', info.agent_name || '--');
        html += lcarsDataRow('COMPANION', info.companion_name || '--');
        html += lcarsDataRow('SESSION', info.session_id || '--');
        html += '</div>';

        // Model
        html += '<div class="sys-detail-section">';
        html += '<div class="sys-detail-title">Models</div>';
        html += lcarsDataRow('CHAT', info.model || '--');
        html += lcarsDataRow('SUMMARY', info.summary_model || '--');
        html += '</div>';

        // Platform
        html += '<div class="sys-detail-section">';
        html += '<div class="sys-detail-title">Platform</div>';
        html += lcarsDataRow('OS', info.platform || '--');
        html += lcarsDataRow('PYTHON', info.python_version || '--');
        html += lcarsDataRow('MESSAGES', info.message_count || 0);
        html += '</div>';

        // Memory config
        if (info.memory) {
            html += '<div class="sys-detail-section">';
            html += '<div class="sys-detail-title">Memory</div>';
            html += lcarsDataRow('AUTO FACTS', info.memory.auto_extract_facts ? 'ON' : 'OFF');
            html += lcarsDataRow('AUTO SUMMARY', info.memory.auto_summarize ? 'ON' : 'OFF');
            html += lcarsDataRow('CONTEXT', info.memory.max_context + ' msgs');
            html += lcarsDataRow('SEARCH', info.memory.max_search_results + ' results');
            html += '</div>';
        }

        // Voice
        if (info.voice) {
            html += '<div class="sys-detail-section">';
            html += '<div class="sys-detail-title">Voice</div>';
            html += lcarsDataRow('TTS', info.voice.tts_enabled ? 'ON' : 'OFF');
            html += lcarsDataRow('STT', info.voice.stt_enabled ? 'ON' : 'OFF');
            html += lcarsDataRow('INPUT', info.voice.input_mode || 'text');
            html += '</div>';
        }

        // Active packs
        if (info.packs) {
            html += '<div class="sys-detail-section">';
            html += '<div class="sys-detail-title">Active Packs</div>';
            html += lcarsDataRow('PERSONA', (info.packs.personality || '--').toUpperCase());
            html += lcarsDataRow('VOICE', (info.packs.voice || '--').toUpperCase());
            html += lcarsDataRow('THEME', (info.packs.theme || '--').toUpperCase());
            html += '</div>';
        }

        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<div class="task-empty">Could not load system info</div>';
    }
}

// ========== THEME SWITCHING ==========

async function switchTheme(themeName) {
    if (!themeName) return;

    try {
        const res = await fetch(API + '/theme/switch', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({theme_name: themeName}),
        });
        const data = await res.json();
        if (data.theme) {
            applyTheme(data.theme);
            currentTheme = data.theme;
        }
    } catch (e) {
        console.error('Theme switch failed:', e);
    }
}

// ========== SESSION PERSISTENCE ==========

window.addEventListener('beforeunload', function() {
    var blob = new Blob(['{}'], {type: 'application/json'});
    navigator.sendBeacon(API + '/end-session', blob);
});

// ========== STARTUP ==========

async function init() {
    await loadTheme();
    loadStatus();
    loadCommands();

    // Load initial task count
    try {
        const res = await fetch(API + '/tasks', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({action: 'list'}),
        });
        const data = await res.json();
        updateTaskCount(data.tasks || []);
    } catch (e) {}

    // Fetch agent name for top bar
    try {
        const res = await fetch(API + '/status');
        const data = await res.json();
        const name = data.agent_name || 'AEGIS';
        document.getElementById('agentName').textContent = name.toUpperCase();
    } catch (e) {}

    // Show desktop top-endcap label on wider screens
    if (window.innerWidth >= 768) {
        var lbl = document.querySelector('.top-endcap-label');
        if (lbl) lbl.style.display = 'block';
        var hamburger = document.querySelector('.hamburger');
        if (hamburger) hamburger.style.display = 'none';
    }

    // Connection polling every 30s
    setInterval(checkConnection, 30000);

    // Task count refresh every 60s
    setInterval(function() {
        loadTasks().catch(function() {});
    }, 60000);
}

init();
</script>
